[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ade"
version = "0.2.0"
description = "Parser & Ekstraktor Dokumen Pengadaan — AI Engineer, Delivery Ops Layer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sutriadik", email = "sutriadik@example.com"},
]
keywords = ["pdf", "parser", "ocr", "extraction", "nocodb", "delivery-ops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: General",
]

# Dependencies INTI saja -- mesin OCR berat sengaja dipindah ke optional-extras di bawah
# supaya instalasi dasar tidak menarik torch/paddle (~2 GB).
#
# Daftar ini dan requirements.txt harus tetap sejalan. requirements.txt tetap jadi rujukan
# operasional (memuat catatan per paket dan penanda platform); yang di sini adalah
# himpunan minimum agar `pip install -e .` menghasilkan lingkungan yang bisa jalan.
dependencies = [
    "docling>=2.0.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "rapidocr-onnxruntime>=1.4.0",
    "pydantic>=2.9.0",
    "ollama>=0.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]
paddle = [
    "paddleocr>=2.7.0,<3.0",
    "paddlepaddle>=2.5.0",
]

# [project.scripts] sengaja TIDAK didefinisikan. `app.main:app` adalah instance FastAPI,
# bukan fungsi, sehingga entry point console akan gagal saat dipanggil. Menjalankan service
# sudah ada jalurnya: `make serve` atau `uvicorn app.main:app`.

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.ruff]
# PEP 8 dengan batas baris 100 (PEP 8 mengizinkan hingga 99-100 bila disepakati tim).
# Jalankan: `make rapi` (perbaiki + format) dan `make cek-gaya` (dipakai CI).
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle (PEP 8), F pyflakes, I urutan import, B bugbear, UP sintaks Python 3.11,
# SIM penyederhanaan, C4 comprehension.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "B008",   # Depends()/File()/Form() sebagai nilai bawaan adalah idiom FastAPI
    "B905",   # zip(strict=...) akan mengubah perilaku pada data yang panjangnya beda
    "UP042",  # StrEnum mengubah hasil str() pada enum yang sudah dipakai di JSON
    "SIM105", # contextlib.suppress tidak lebih jelas daripada try/except singkat
]

[tool.ruff.lint.per-file-ignores]
# Skrip CLI & eval menambah path proyek ke sys.path sebelum import app.
"scripts/*" = ["E402"]
"eval/*" = ["E402"]
# Prompt LLM adalah teks yang dibaca model: memotong baris atau membuang spasi di dalamnya
# mengubah keluaran (terbukti 4 Okt 2026). Biarkan apa adanya.
"app/extractors/prompts.py" = ["E501", "W291", "W293"]
# Berkas yang stringnya dikirim ke LLM: deskripsi Field Pydantic (jadi skema JSON untuk
# Ollama), tugas/template per kelompok field, dan prompt refiner. Kode di dalamnya tetap
# diformat; hanya teks panjangnya yang dibiarkan satu baris supaya tidak tersunting.
"app/schemas/*" = ["E501"]
"app/extractors/ollama_client.py" = ["E501"]
"app/parsers/markdown_refiner.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "dol_schema"]
