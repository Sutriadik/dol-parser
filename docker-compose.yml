# dol-parser — menjalankan API sebagai service.
#
#   docker compose up -d api
#   docker compose run --rm api python3 scripts/cek_ocr.py   # mesin OCR apa saja yang hidup

services:
  # ---------------------------------------------------------------------------- API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        dol-schema: ../dol-schema
    image: openade:cpu
    # Dijalankan sebagai service, bukan perintah cek OCR bawaan image.
    command: ["python3", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Ollama jalan di HOST, bukan di dalam container: model 4.7 GB tidak ikut ke image,
      # dan di macOS hanya proses host yang bisa memakai GPU Metal.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # NOCODB_URL di .env (localhost:8080) di dalam container menunjuk container ini
      # sendiri, jadi push gagal "connection refused". NocoDB diakses lewat port host.
      NOCODB_URL: ${NOCODB_URL_DARI_DOCKER:-http://host.docker.internal:8080}
      OCR_ENGINE: rapidocr
      LOG_LEVEL: INFO
    extra_hosts:
      # Diperlukan di Linux; di Docker Desktop (Mac/Windows) sudah tersedia sendiri.
      - "host.docker.internal:host-gateway"
    volumes:
      # Hasil parsing/ekstraksi bisa dibaca dari host tanpa masuk ke container.
      - ./storage:/app/storage
      - ocr-models:/models
    healthcheck:
      # /health tidak butuh API key, justru supaya bisa dipakai di sini.
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      # Muat model pertama kali lambat; tanpa start_period container ditandai unhealthy
      # sebelum sempat siap.
      start_period: 180s
      retries: 3
    restart: unless-stopped


volumes:
  ocr-models:
