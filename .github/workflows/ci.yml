# CI Open ADE — menjalankan tes dan memindai kredensial pada tiap push.
#
# Kenapa ada: repo ini publik dan pernah nyaris kemasukan token NocoDB. Pemindaian di
# bawah adalah jaring pengaman yang tidak bergantung pada seseorang ingat menjalankan
# `make cek-rahasia` sebelum push.
#
# Mesin OCR (docling/torch/paddle, ~2 GB) TIDAK dipasang di sini: memasangnya membuat CI
# berjalan belasan menit. Konsekuensinya 8 tes yang memanggil Docling sungguhan akan
# DILEWATI -- ditandai `skipped` di laporan, bukan dianggap lulus. Jalankan `make test`
# lokal dengan dependensi penuh sebelum merge perubahan pada app/parsers/.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rahasia:
    name: Pindai kredensial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # seluruh riwayat, supaya commit lama ikut diperiksa

      - name: Kredensial di working tree
        run: |
          if grep -rnE 'nc_pat_[A-Za-z0-9]{10,}|xc-token: *[A-Za-z0-9]{10,}' \
               --include='*.py' --include='*.md' --include='*.yml' --include='*.json' \
               --exclude-dir=.git . ; then
            echo "::error::Kredensial terdeteksi di working tree"
            exit 1
          fi

      - name: Kredensial di dalam riwayat
        run: |
          # Memeriksa ISI POHON tiap commit, bukan `git log -S`: -S juga cocok pada commit
          # yang MENGHAPUS token, sehingga perbaikannya sendiri ikut dilaporkan.
          if git grep -I -q -E 'nc_pat_[A-Za-z0-9]{10,}' $(git rev-list HEAD) -- '*.py' '*.md' '*.json' 2>/dev/null; then
            echo "::error::Token ditemukan di dalam riwayat commit"
            exit 1
          fi

      - name: .env tidak boleh ter-track
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env ter-track git"
            exit 1
          fi

      - name: Data klien tidak boleh ter-track
        run: |
          if git ls-files | grep -qE '^sample_pdfs/|^storage/outputs/|^eval/golden/|\.pdf$|\.docx$'; then
            echo "::error::Data klien ter-track git"
            git ls-files | grep -E '^sample_pdfs/|^storage/outputs/|^eval/golden/|\.pdf$|\.docx$'
            exit 1
          fi

  tes:
    name: Tes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Skema data bersama. Repo dol-schema harus ada di GitHub (Sutriadik/dol-schema);
      # untuk repo privat, tambahkan secret DOL_SCHEMA_TOKEN berisi token baca.
      - uses: actions/checkout@v4
        with:
          repository: Sutriadik/dol-schema
          path: dol-schema
          token: ${{ secrets.DOL_SCHEMA_TOKEN || github.token }}

      - name: Pasang dependensi ringan
        run: |
          python -m pip install --upgrade pip
          # Hanya yang dibutuhkan tes. Mesin OCR sengaja dilewati (lihat catatan di atas).
          pip install pytest httpx fastapi 'uvicorn[standard]' python-multipart \
                      'pydantic>=2.9' pymupdf pillow numpy ollama
          pip install ./dol-schema
          python -m dol_schema --check

      - name: Periksa gaya kode (PEP 8)
        run: |
          pip install "ruff>=0.6"
          ruff check .
          ruff format --check .

      - name: Jalankan tes
        # -rs menampilkan alasan tiap tes yang dilewati, supaya jumlah skip yang
        # membengkak diam-diam langsung terlihat di log.
        run: python -m pytest -q -rs
